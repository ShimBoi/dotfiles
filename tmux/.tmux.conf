# Prefix: Ctrl+a (easier reach than default Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of life
set -g mouse on
set -g mode-keys vi   # copy-mode navigation feels like vim: hjkl, Ctrl-u/d, gg/G

# In copy-mode (prefix + [), v/y/Escape behave like visual mode.
# Both keyboard copy (y) and mouse-drag copy pipe into pbcopy so the
# result actually lands on the macOS system clipboard (Cmd+V anywhere).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 50000
set -as terminal-features ",xterm-ghostty:RGB"

# Splits open in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Plugins (cloned directly into ~/.tmux/plugins, no TPM runtime needed)
set -g @continuum-restore 'on'

run-shell ~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux  # Ctrl+h/j/k/l moves between tmux panes AND nvim splits seamlessly
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux               # save/restore sessions manually (prefix + Ctrl-s / Ctrl-r)
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux               # auto-save sessions every 15 min + auto-restore on tmux start

# tpm itself is still installed at ~/.tmux/plugins/tpm if you want to add
# more plugins later the standard way (add a `set -g @plugin '...'` line,
# then prefix + I inside a live tmux session)
